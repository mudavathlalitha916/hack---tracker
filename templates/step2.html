<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step 2 - Login</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="step-panel" style="padding-bottom: 20px;">
        <div class="steps-bar">
          <span class="step-pill done">Step 1</span>
          <span class="step-pill active">Step 2</span>
          <span class="step-pill">Step 3</span>
          <span class="step-pill">Step 4</span>
          <span class="step-pill">Step 5</span>
        </div>
        <div class="section-heading">
          <h1>Step 2 - Login</h1>
          <p>Log in to continue to the company list and search tools.</p>
        </div>
        <form id="loginForm" class="auth-form">
          <input id="loginEmail" type="email" placeholder="Email address" required />
          <input id="loginPassword" type="password" placeholder="Password" required />
          <button class="btn primary" type="submit">Log in</button>
          <div id="loginError" class="auth-error"></div>
        </form>
        <div class="nav-links">
          <a class="btn secondary small" href="/step1">Previous</a>
          <a class="btn primary small" href="/step3">Next step</a>
        </div>
      </div>
    </div>
    <script src="/static/auth.js"></script>
  </body>
</html>
