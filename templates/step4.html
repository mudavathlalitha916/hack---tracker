<h1>Step 4 - Find Hackathon 🔍</h1>
<form method="GET">
<input type="text" name="q" placeholder="Search by city or company" value="{{ query }}">
<button>Search</button>
</form>
{% for r in results %}
<p><b>{{ r[1] }}</b> by {{ r[2] }} on {{ r[3] }} at {{ r[4] }}</p>
{% endfor %}
<a href="/dashboard">Back</a>
